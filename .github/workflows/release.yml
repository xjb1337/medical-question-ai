name: Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebugAndroidTest --stacktrace

  release:
    name: Build signed release and publish
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ secrets.ANDROID_EXPECTED_CERT_SHA256 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 未配置"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD 未配置"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS 未配置"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD 未配置"; exit 1; }
          test -n "$EXPECTED_CERT" || { echo "ANDROID_EXPECTED_CERT_SHA256 未配置"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build versioned release APK
        env:
          VERSION_CODE: ${{ format('{0}{1}', '100000', github.run_number) }}
          VERSION_NAME: ${{ format('1.2.0-test.{0}', github.run_number) }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME" --stacktrace
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
      - name: Generate update metadata
        env:
          APK_PATH: app/build/outputs/apk/release/app-release.apk
          EXPECTED_CERT: ${{ secrets.ANDROID_EXPECTED_CERT_SHA256 }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk dist/medical-question-ai.apk
          bash scripts/release/generate-update-json.sh
          cat dist/update.json
          test -f app/build/outputs/mapping/release/mapping.txt && cp app/build/outputs/mapping/release/mapping.txt dist/mapping.txt || true
      - name: Verify signing certificate
        env:
          EXPECTED_CERT: ${{ secrets.ANDROID_EXPECTED_CERT_SHA256 }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          SIGNER=$(apksigner verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr 'A-F' 'a-f')
          test -n "$SIGNER" || { echo "无法读取 APK 签名证书"; exit 1; }
          test "$SIGNER" = "$(echo "$EXPECTED_CERT" | tr 'A-F' 'a-f')" || { echo "APK 签名证书与固定证书不一致"; exit 1; }
      - name: Check release is newer than latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
        run: |
          LATEST=$(gh release view --repo "${{ github.repository }}" --json assets --jq '.assets[] | select(.name=="update.json") | .url' 2>/dev/null || true)
          if [ -n "$LATEST" ]; then
            CURRENT=$(gh api "$LATEST" -H "Accept: application/vnd.github.raw" | python3 -c 'import json,sys; print(json.load(sys.stdin)["versionCode"])')
            test "$VERSION_CODE" -gt "$CURRENT" || { echo "候选版本 $VERSION_CODE 不高于已发布版本 $CURRENT"; exit 1; }
          fi
      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: |
          TAG="v${VERSION_NAME}"
          NOTES="版本 ${VERSION_NAME}（build ${VERSION_CODE}）"
          ASSETS=(dist/update.json dist/medical-question-ai.apk)
          test -f dist/mapping.txt && ASSETS+=(dist/mapping.txt)
          gh release create "$TAG" "${ASSETS[@]}" \
            --repo "${{ github.repository }}" --title "$TAG" --notes "$NOTES" --draft
          gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --latest
