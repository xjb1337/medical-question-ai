name: Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebugAndroidTest --stacktrace

  release:
    name: Build signed release and publish
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify commit is current main head
        run: |
          git fetch --no-tags origin main
          MAIN_SHA=$(git rev-parse origin/main)
          test "$MAIN_SHA" = "$GITHUB_SHA" || { echo "候选提交 $GITHUB_SHA 已不是 main 当前头 $MAIN_SHA，拒绝发布"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ secrets.ANDROID_EXPECTED_CERT_SHA256 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 未配置"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD 未配置"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS 未配置"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD 未配置"; exit 1; }
          test -n "$EXPECTED_CERT" || { echo "ANDROID_EXPECTED_CERT_SHA256 未配置"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build versioned release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          BASE_VERSION_CODE=100000
          VERSION_CODE=$((BASE_VERSION_CODE + GITHUB_RUN_NUMBER))
          if [ "$VERSION_CODE" -gt 2100000000 ]; then echo "versionCode 超出 Android 整数范围"; exit 1; fi
          VERSION_NAME="1.2.1-test.${GITHUB_RUN_NUMBER}"
          ./gradlew assembleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME" --stacktrace
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
      - name: Generate update metadata
        env:
          APK_PATH: app/build/outputs/apk/release/app-release.apk
          EXPECTED_CERT: ${{ secrets.ANDROID_EXPECTED_CERT_SHA256 }}
          EXPECTED_APPLICATION_ID: com.xjb.medicalquestionai
          EXPECTED_MIN_SDK: '26'
          EXPECTED_VERSION_CODE: ${{ env.VERSION_CODE }}
          EXPECTED_VERSION_NAME: ${{ env.VERSION_NAME }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/medical-question-ai.apk
          bash scripts/release/generate-update-json.sh
          cat dist/update.json
          test -f app/build/outputs/mapping/release/mapping.txt && cp app/build/outputs/mapping/release/mapping.txt dist/mapping.txt || true
      - name: Verify signing certificate
        env:
          EXPECTED_CERT: ${{ secrets.ANDROID_EXPECTED_CERT_SHA256 }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(command -v apksigner || find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER" || { echo "apksigner 未找到"; exit 1; }
          SIGNER=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr 'A-F' 'a-f')
          test -n "$SIGNER" || { echo "无法读取 APK 签名证书"; exit 1; }
          test "$SIGNER" = "$(echo "$EXPECTED_CERT" | tr 'A-F' 'a-f')" || { echo "APK 签名证书与固定证书不一致"; exit 1; }
      - name: Check release is newer than latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          CANDIDATE_TAG: v${{ env.VERSION_NAME }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases"
          TMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TMP_DIR"' EXIT
          HTTP=$(curl -sS -o "$TMP_DIR/latest.json" -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/latest")
          if [ "$HTTP" = "404" ]; then
            echo "尚无已发布 Release，允许首次发布"
          elif [ "$HTTP" != "200" ]; then
            echo "读取最新 Release 失败（HTTP $HTTP）"; exit 1
          else
            LATEST_TAG=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tag_name"])' "$TMP_DIR/latest.json")
            gh release download "$LATEST_TAG" --repo "$GITHUB_REPOSITORY" --pattern update.json --dir "$TMP_DIR" --clobber
            python3 scripts/release/check-release.py \
              --latest "$TMP_DIR/update.json" \
              --candidate-version-code "$VERSION_CODE" \
              --candidate-tag "$CANDIDATE_TAG" \
              --latest-tag "$LATEST_TAG" \
              --candidate-sha "$GITHUB_SHA"
          fi
      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: |
          TAG="v${VERSION_NAME}"
          NOTES="版本 ${VERSION_NAME}（build ${VERSION_CODE}）"
          ASSETS=(dist/update.json dist/medical-question-ai.apk)
          test -f dist/mapping.txt && ASSETS+=(dist/mapping.txt)
          gh release create "$TAG" "${ASSETS[@]}" \
            --repo "${{ github.repository }}" --target "$GITHUB_SHA" --title "$TAG" --notes "$NOTES" --draft
          gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --latest
